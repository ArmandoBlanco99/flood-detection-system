[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Preserve literal f-strings in this formatting-only pass.
ignore = ["F541"]

[tool.ruff.lint.per-file-ignores]
# These script entry points intentionally set sys.path before importing modules.
"wsgi.py" = ["E402"]
"tests/test_fix.py" = ["E402"]
"tests/test_specific_coordinates.py" = ["E402"]
# Preserve the existing NumPy import in the training pipeline.
"src/process_dataset.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
